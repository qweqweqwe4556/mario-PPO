[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mario-rl"
version = "0.2.0"
description = "Train, evaluate, and inspect PPO agents on Super Mario Bros."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "gym-super-mario-bros==7.4.0",
    "nes-py==8.2.1",
    "gym==0.25.2",
    "shimmy~=1.3.0",
    "stable-baselines3[extra]==2.3.2",
    "opencv-python==4.10.0.84",
    "tensorboard==2.17.1",
    "tqdm==4.66.5",
    "numpy<2",
]

[project.optional-dependencies]
dev = ["build>=1.2,<2", "pytest>=8,<9"]

[project.scripts]
mario-train = "mario_rl.train:main"
mario-evaluate = "mario_rl.evaluate:main"
mario-play = "mario_rl.play:main"
mario-smoke-test = "mario_rl.smoke_test:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
